[mypy]
python_version = 3.13
strict = true
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = tests/.*|test_.*\.py|.*_test\.py

# ``fastblocks.cli`` uses ``@cli.command()`` decorators inherited from
# ``oneiric.cli.base.OneiricCLIBase``. ``OneiricCLIBase`` is typed as
# ``Any`` under our mypy config because oneiric uses Python 3.14 syntax
# (``except*``) that the py3.13 mypy target cannot parse. The cascade
# of ``untyped-decorator`` errors on the existing ``@cli.command()``
# decorators is purely a downstream-typing artifact — the decorators
# themselves were correct against a plain ``typer.Typer`` prior to
# task 8's OneiricCLIBase adoption.
[mypy-fastblocks.cli]
disable_error_code = untyped-decorator, misc
