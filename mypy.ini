[mypy]
# fastblocks targets Python 3.14 (`requires-python = ">=3.14"`); set
# python_version to 3.14 so mypy parses the same syntax that venv
# Python does. Targeting 3.13 here previously caused parse errors on
# Python 3.14-only syntax in upstream deps (e.g. mcp_common's
# `except A, B:` comma-form except clauses, valid only in 3.14).
python_version = 3.14
strict = true
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = tests/.*|test_.*\.py|.*_test\.py

# ``fastblocks.cli`` uses ``@cli.command()`` decorators inherited from
# ``oneiric.cli.base.OneiricCLIBase``. ``OneiricCLIBase`` is typed as
# ``Any`` under our mypy config because oneiric's runtime typing is
# opaque to mypy's stub resolver. The cascade of ``untyped-decorator``
# errors on the existing ``@cli.command()`` decorators is purely a
# downstream-typing artifact — the decorators themselves were correct
# against a plain ``typer.Typer`` prior to task 8's OneiricCLIBase
# adoption.
[mypy-fastblocks.cli]
disable_error_code = untyped-decorator, misc

# ``fastblocks.middleware`` is locked-out of edits by the audit-pass
# scope (brief IMP-NN: "Don't touch fastblocks/middleware.py"). The
# ``Middleware(middleware_class, **options)`` call at line 573 fails
# ``arg-type`` because starlette's ``_MiddlewareFactory`` Protocol
# expects a callable that takes ``app`` as the first arg; the typed
# middleware classes satisfy the Protocol structurally but mypy cannot
# see that without a custom stub. Until the task 4 brief permits
# middleware.py edits, this is the cheapest gate. Removal plan:
# either (a) tighten the middleware registry to type each entry as
# ``_MiddlewareFactory[KwArg(Any)]``, or (b) cast ``middleware_class``
# to the Protocol at the call site. Tracked in
# ``docs/known-type-issues.md``.
[mypy-fastblocks.middleware]
disable_error_code = arg-type
