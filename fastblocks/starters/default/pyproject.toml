# req: REQ-P2-B1-001
[project]
name = "{app_name}"
version = "0.1.0"
description = "FastBlocks app scaffolded by `fastblocks create-app`"
requires-python = ">=3.14"
dependencies = [
    "fastblocks>=0.24,<0.25",
    "fastblocks-ui>=0.9,<0.10",
    "oneiric>=0.21,<0.22",
]

[project.scripts]
fastblocks = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
