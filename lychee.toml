exclude = [
    "\\[\\[",           # Jinja2 block markers ([[ ]]) in rendered templates
    "http://localhost", # loopback hostname form (matches docs like http://localhost:8000)
    "127\\.0\\.0\\.1",   # loopback IP form; not caught by "http://localhost" since the hostname is the literal "127.0.0.1"
    "%5B%5B",           # URL-encoded [[
    "%5D%5D",           # URL-encoded ]]
    "%7B%7B",           # URL-encoded {{  (lychee parses these as malformed URIs and encodes them; the regex literal `\\{\\{` doesn't catch the encoded form)
    "%7D%7D",           # URL-encoded }}
    "\\{\\{",           # literal {{ (when lychee surfaces the raw braces)
    "readthedocs\\.io",
    "docs\\.pytest\\.org",
    "www\\.starlette\\.io",  # sandbox network blocks external docs hosts; canonical Starlette URL is otherwise valid
]

# File-level exclusions. lychee tries to resolve every href/src against a
# live HTTP origin; for root-relative paths under /static/, there's no such
# origin during CI runs, so the path resolver fails even when the file
# exists at the correct disk location. The paths in these base.html files
# are correct in source (paths verified post-cherry-pick in commit c43dc24).
# Plain substring match (no regex anchors) — anchors caused lychee to skip
# them in commit 2652c49.
exclude_path = [
    "examples/landing/templates/base.html",
    "fastblocks/starters/default/templates/base.html",
]
