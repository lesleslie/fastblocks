# req: REQ-P2-B3-001
[project]
name = "fastblocks-htmy-hybrid-example"
version = "0.1.0"
description = "HTMY ↔ Jinja2 hybrid-render demo for FastBlocks — Phase 2 dogfood B3."
requires-python = ">=3.14"
dependencies = [
    "fastblocks>=0.24,<0.25",
    "fastblocks-ui>=0.9,<0.10",
    "oneiric>=0.21,<0.22",
    "htmy>=0.1,<0.2",
    "jinja2>=3.1,<4.0",
]

[project.scripts]
fastblocks = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]